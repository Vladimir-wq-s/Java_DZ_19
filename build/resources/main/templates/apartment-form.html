<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Квартира - Форма</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { padding: 10px 20px; margin-top: 20px; border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 16px; }
        .btn-save { background-color: #28a745; }
        .btn-cancel { background-color: #6c757d; text-decoration: none; display: inline-block; }
    </style>
</head>
<body>
<div class="container">
    <h1>Квартира</h1>
    <form th:action="@{/apartments/save}" method="post" th:object="${apartment}">
        <input type="hidden" th:field="*{id}"/>

        <label>Адрес:</label>
        <input type="text" th:field="*{address}" required/>

        <label>Количество комнат:</label>
        <input type="number" th:field="*{rooms}" required/>

        <label>Цена за месяц (руб):</label>
        <input type="number" step="0.01" th:field="*{monthlyPrice}" required/>

        <label>Арендодатель:</label>
        <select th:field="*{landlord.id}" required>
            <option value="">-- Выберите арендодателя --</option>
            <option th:each="landlord : ${landlords}"
                    th:value="${landlord.id}"
                    th:text="${landlord.fullName}">Иванов</option>
        </select>

        <button type="submit" class="btn btn-save">Сохранить</button>
        <a href="/apartments" class="btn btn-cancel">Отмена</a>
    </form>
</div>
</body>
</html>
